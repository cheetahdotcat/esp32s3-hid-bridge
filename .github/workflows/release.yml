name: Release firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Build firmware
        run: |
          pip install platformio==6.2.0
          pio run -d firmware -e esp32-s3-led-gpio21 -e esp32-s3-devkitc-1

      - name: Check version
        run: |
          version=$(sed -n 's/^#define BRIDGE_FIRMWARE_VERSION "\(.*\)"$/\1/p' firmware/src/bridge.h)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match firmware version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Assemble images
        run: |
          mkdir -p dist
          for pair in esp32-s3-led-gpio21:xiao-esp32s3 esp32-s3-devkitc-1:devkitc-ws2812; do
            env=${pair%%:*}
            name=${pair##*:}
            build=firmware/.pio/build/$env
            python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
              -o "dist/lvhb-$VERSION-$name.bin" --flash_mode dio --flash_freq 80m --flash_size 4MB \
              0x0 "$build/bootloader.bin" 0x8000 "$build/partitions.bin" 0x10000 "$build/firmware.bin"
          done
          (cd dist && sha256sum *.bin > SHA256SUMS)
          # Release notes: this version's CHANGELOG section.
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Firmware $VERSION" --notes-file dist/notes.md \
            dist/*.bin dist/SHA256SUMS
