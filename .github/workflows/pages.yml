name: Build firmware and deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Only the bridge protocol header is needed from libvirtualhid.
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini', 'firmware/src/idf_component.yml', 'firmware/sdkconfig.defaults') }}

      - name: Build firmware
        run: |
          pip install platformio==6.2.0
          pio run -d firmware

      - name: Assemble site
        run: |
          version=$(sed -n 's/^#define BRIDGE_FIRMWARE_VERSION "\(.*\)"$/\1/p' firmware/src/bridge.h)
          build=firmware/.pio/build/esp32-s3-devkitc-1
          mkdir -p site/firmware
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
            -o site/firmware/lvhb-esp32s3.bin --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 "$build/bootloader.bin" 0x8000 "$build/partitions.bin" 0x10000 "$build/firmware.bin"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$version\"/" site/manifest.json
          sed -i "s/Firmware [0-9][0-9.]*/Firmware $version/" site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
