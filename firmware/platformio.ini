; ESP32-S3 libvirtualhid USB bridge firmware.
; The native USB port (GPIO19/20) enumerates as CDC + up to two gamepad slots.

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
; 4 MB DIO boots on every common ESP32-S3 board with quad flash (4/8/16 MB).
board_build.flash_mode = dio
board_upload.flash_size = 4MB
monitor_speed = 115200
; The esptool stub loader times out over the S3's USB-Serial/JTAG on some boards.
upload_flags = --no-stub
build_flags =
    -I../libvirtualhid/src/platform/esp32
